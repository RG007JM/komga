name: Build Komga Release (Draft)

on:
  # This workflow is dispatched from the default branch. Use source_ref to
  # build the merged feature branch without requiring this file on that branch.
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "test/komga-1.29.2-merge"
        type: string
      release_version:
        description: "Expected version from gradle.properties (for example 1.29.2)"
        required: false
        type: string
      release_tag:
        description: "Optional Git tag for the draft; leave empty to generate a unique test tag"
        required: false
        type: string
      release_name:
        description: "Optional draft release title"
        required: false
        type: string
      release_body:
        description: "Optional release notes (Markdown)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build, checksum, and create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Validate source version and prepare release metadata
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          source_version="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          if [[ -z "$source_version" ]]; then
            echo "::error::Could not read version= from gradle.properties."
            exit 1
          fi

          release_version="${INPUT_VERSION:-$source_version}"
          if [[ "$release_version" != "$source_version" ]]; then
            echo "::error::Source branch version is $source_version, but requested version is $release_version."
            exit 1
          fi
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Invalid release version: $release_version"
            exit 1
          }

          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:7}"
          release_tag="${INPUT_TAG:-${release_version}-draft-${short_sha}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}}"
          release_name="${INPUT_NAME:-Komga ${release_version} (draft ${short_sha})}"

          [[ "$release_tag" =~ ^[0-9A-Za-z._-]+$ ]] || {
            echo "::error::Invalid release tag: $release_tag"
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $release_tag"
            exit 1
          fi

          {
            echo "release_version=$release_version"
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

          echo "Building version $release_version from $source_sha"

      - name: Legacy WebUI - setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: Legacy WebUI - build
        working-directory: komga-webui
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: NextUI - setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: NextUI - build with translations
        working-directory: next-ui
        run: npm run build:with-i18n

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          java-package: 'jdk'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Full backend checks and package both JARs
        run: >
          ./gradlew
          clean
          build
          :komga-tray:jar
          :komga:webuiCopyIndex
          :komga:nextuiCopyIndex
          :komga:bootJar
          --no-daemon
          --console=plain
          --stacktrace

      - name: Prepare executable JAR and SHA-256 checksum
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          main_jar="komga/build/libs/komga-${RELEASE_VERSION}.jar"
          test -s "$main_jar" || {
            echo "::error::Missing executable Komga JAR: $main_jar"
            exit 1
          }

          cp "$main_jar" release-assets/
          (
            cd release-assets
            sha256sum "komga-${RELEASE_VERSION}.jar" > checksums_sha256.txt
            sha256sum -c checksums_sha256.txt
          )

      - name: Create GitHub draft release and upload JAR/checksum
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: ${{ steps.metadata.outputs.release_name }}
          body: ${{ inputs.release_body || format('Automated draft build from {0} at commit {1}. This is an unpublished validation build.', steps.metadata.outputs.source_sha, steps.metadata.outputs.source_sha) }}
          draft: true
          prerelease: false
          target_commitish: ${{ steps.metadata.outputs.source_sha }}
          fail_on_unmatched_files: true
          files: |
            release-assets/komga-${{ steps.metadata.outputs.release_version }}.jar
            release-assets/checksums_sha256.txt

      - name: Keep downloadable build artifact
        uses: actions/upload-artifact@v7
        with:
          name: komga-release-candidate-${{ github.run_number }}
          path: |
            release-assets/komga-${{ steps.metadata.outputs.release_version }}.jar
            release-assets/checksums_sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kotlin/Gradle test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: komga-gradle-test-reports-${{ github.run_number }}
          path: |
            komga/build/test-results/
            komga/build/reports/tests/
            komga-tray/build/test-results/
            komga-tray/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
