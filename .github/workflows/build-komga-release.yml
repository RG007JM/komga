name: Build Komga Release (Draft)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Komga and Tray JARs (no publishing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Legacy WebUI - setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: Legacy WebUI - build
        working-directory: komga-webui
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: NextUI - setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: NextUI - build with translations
        working-directory: next-ui
        run: npm run build:with-i18n

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          java-package: 'jdk'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Full backend checks and package both JARs
        run: >
          ./gradlew
          clean
          build
          :komga-tray:jar
          :komga:webuiCopyIndex
          :komga:nextuiCopyIndex
          :komga:bootJar
          --no-daemon
          --console=plain
          --stacktrace

      - name: Upload Komga and Tray JARs
        uses: actions/upload-artifact@v7
        with:
          name: komga-draft-release-${{ github.run_number }}
          path: |
            komga/build/libs/komga-*.jar
            komga-tray/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Kotlin/Gradle test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: komga-gradle-test-reports-${{ github.run_number }}
          path: |
            komga/build/test-results/
            komga/build/reports/tests/
            komga-tray/build/test-results/
            komga-tray/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
